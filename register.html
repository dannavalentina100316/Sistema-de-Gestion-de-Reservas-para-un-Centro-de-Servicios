<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Motonea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="body-login">

    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-visual">
                <div class="brand">
                    <div class="brand-mark">M</div>
                    <p>Motonea</p>
                </div>
            </div>

            <div class="login-header">
                <span class="eyebrow">Nuevo usuario</span>
                <h2>Regístrate</h2>
                <p>Crea tu cuenta para gestionar el taller</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu.correo@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <div id="error-message" class="error-hidden"></div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
